{% extends "base.html" %}
{% block title %}萎凋批次{% endblock %}
{% block content %}
<div class="page-header">
  <h1>萎凋批次</h1>
  <div class="actions">
    <form method="get" style="display:inline">
      <input class="input" name="garden" placeholder="按茶园名过滤" value="{{ request.GET.garden }}">
      <button class="btn btn-secondary btn-sm" type="submit">过滤</button>
    </form>
    <button class="btn btn-secondary btn-sm"
            hx-get="{% url 'batch_list' %}"
            hx-target="#batch-table"
            hx-swap="innerHTML">刷新列表</button>
    <a class="btn" href="{% url 'batch_create' %}">新建批次</a>
  </div>
</div>
<div class="card" id="batch-table">
  {% include "batches/_table.html" %}
</div>
{% endblock %}
